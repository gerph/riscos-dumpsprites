[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riscos-dumpsprites"
version = "0.2.0"
description = "Inspect RISC OS sprite files, and convert them to and from PNG/PNM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Charles Ferguson", email = "gerph@gerph.org" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/gerph/riscos-dumpsprite"

[project.scripts]
riscos-dumpsprites = "riscos_dumpsprites.cli:main"
riscos-sprites = "riscos_sprites.cli:main"

[tool.setuptools.packages.find]
include = ["riscos_sprites*", "riscos_dumpsprites*"]
